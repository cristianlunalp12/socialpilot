# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates a Postgres database and ONE web service that runs both the app and the background worker.
# Free plans are fine for a public demo; for real customers switch to paid plans (see README).
services:
  - type: web
    name: socialpilot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: socialpilot-db
          property: connectionString
      # Random 256-bit base64 values generated by Render (the format both secrets expect).
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # "mock" = public demo with simulated networks; "live" = real Facebook/Instagram/TikTok/YouTube.
      - key: PLATFORM_MODE
        value: mock
      # Loads the demo account (demo@socialpilot.dev / demo12345) and sample data. Set to "false" for real customers.
      - key: DEMO_SEED
        value: "true"
      - key: NODE_VERSION
        value: "22"
      # Values you type in the Render dashboard (never commit them):
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: socialpilot-db
    plan: free
    databaseName: socialpilot
    user: socialpilot
